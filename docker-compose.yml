services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elimubora
      POSTGRES_PASSWORD: elimubora_dev_password
      POSTGRES_DB: elimubora
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elimubora"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
